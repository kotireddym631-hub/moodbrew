{% extends 'base.html' %}
{% block content %}
<div class="auth-container" style="max-width: 460px; margin: 0 auto;">
  <div class="auth-card clay-card" style="padding: 2rem;">
    <h2 class="text-center">🔮 Welcome Back, Alchemist</h2>
    <p class="text-center">Enter your credentials to access your potion journal</p>
    {% if form.errors %}
      <div class="alert-error">Invalid username or password. Try again!</div>
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" placeholder="Your alchemist name" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="Secret passphrase" required>
      </div>
      <button type="submit" class="btn btn-brew" style="width: 100%;">Enter the Lab 🧪</button>
    </form>
    <div class="text-center" style="margin-top: 1rem;">
      <a href="{% url 'register' %}" class="subtle-link">New to the lab?</a>
    </div>
  </div>
</div>
{% endblock %}
